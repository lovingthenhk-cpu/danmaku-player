<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danmaku Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f0f0; color: #222; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    header { background: #fff; border-bottom: 1px solid #ddd; padding: 10px 16px; font-size: 15px; font-weight: 600; }

    .wrap { max-width: 920px; margin: 0 auto; padding: 14px; }

    .drop {
      background: #fff; border: 2px dashed #ccc; border-radius: 4px;
      padding: 24px 16px; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none; margin-bottom: 12px;
    }
    .drop:hover  { border-color: #999; }
    .drop.over   { border-color: #666; background: #f9f9f9; }
    .drop.loaded { border-color: #555; border-style: solid; }
    .drop .icon  { font-size: 26px; margin-bottom: 4px; }
    .drop .sub   { color: #888; font-size: 11px; margin-top: 3px; }
    .drop .sub2  { color: #aaa; font-size: 10px; margin-top: 2px; }
    .drop .fname { color: #555; font-size: 11px; margin-top: 5px; word-break: break-all; }
    .drop .status{ color: #888; font-size: 11px; margin-top: 4px; }
    input[type="file"] { display: none; }

    .player-section { display: none; }
    .player-section.show { display: block; }

    .presize { position: relative; width: 100%; max-width: 100%; }
    .pvideo {
      position: relative; background: #000;
      height: 450px; min-height: 120px; width: 100%;
    }
    .pvideo video {
      width: 100%; height: 100%;
      display: block; object-fit: contain;
    }
    .pvideo canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

    /* south (height) handle — visible bar under the video */
    .resize-handle-s {
      height: 7px; background: #d8d8d8;
      cursor: ns-resize;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
      touch-action: none;
    }
    .resize-handle-s:hover { background: #bbb; }
    .resize-handle-s::after {
      content: ''; display: block;
      width: 32px; height: 2px;
      background: #aaa; border-radius: 1px;
    }
    .resize-handle-s.dragging { background: #aaa; }

    /* east (width) handle — invisible strip on the right edge */
    .resize-handle-e {
      position: absolute; top: 0; right: -4px; bottom: 7px; width: 8px;
      cursor: ew-resize; touch-action: none; z-index: 5;
    }
    .resize-handle-e:hover, .resize-handle-e.dragging { background: rgba(0,0,0,.12); }

    /* southeast (diagonal) handle — small corner grip */
    .resize-handle-se {
      position: absolute; right: -3px; bottom: 0; width: 14px; height: 14px;
      cursor: nwse-resize; touch-action: none; z-index: 6;
      background: linear-gradient(135deg, transparent 0 42%, #999 42% 50%, transparent 50% 64%, #999 64% 72%, transparent 72% 100%);
      opacity: .55;
    }
    .resize-handle-se:hover, .resize-handle-se.dragging { opacity: 1; }

    .controls {
      background: #fff; border: 1px solid #ddd; border-top: none;
      padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .controls button {
      background: #f0f0f0; border: 1px solid #ccc; border-radius: 3px;
      padding: 3px 9px; cursor: pointer; font-size: 13px; color: #333; line-height: 1.4;
    }
    .controls button:hover { background: #e0e0e0; }
    .controls button.on { background: #333; color: #fff; border-color: #333; }
    .controls button:disabled { opacity: .5; cursor: default; }
    .controls select {
      background: #f0f0f0; border: 1px solid #ccc;
      border-radius: 3px; padding: 3px 4px; font-size: 12px; cursor: pointer;
    }
    .seek { flex: 1; display: flex; align-items: center; gap: 6px; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 3px; background: #ddd; border-radius: 2px; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 11px; height: 11px; background: #555; border-radius: 50%;
    }
    .time { font-size: 11px; color: #777; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cbar { padding: 5px 0; font-size: 11px; color: #888; display: flex; gap: 10px; flex-wrap: wrap; }

    .meta { background: #fff; border: 1px solid #ddd; border-top: none; padding: 12px 14px; }
    .meta-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
    .meta-stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: #666; margin-bottom: 9px; }
    .meta-stats strong { color: #333; }
    .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }
    .tag { background: #eee; border-radius: 10px; padding: 2px 8px; font-size: 11px; color: #555; }
    .desc-text {
      font-size: 12px; color: #555; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
      max-height: 64px; overflow: hidden; transition: max-height .25s ease;
    }
    .desc-text.expanded { max-height: none; }
    .desc-toggle {
      display: inline-block; margin-top: 4px;
      background: none; border: none; color: #888; font-size: 11px;
      cursor: pointer; padding: 0; text-decoration: underline;
    }
    .hint { margin-top: 8px; font-size: 11px; color: #bbb; }
  </style>
</head>
<body>
  <header>Danmaku Player</header>
  <div class="wrap">
    <div class="drop" id="vdrop">
      <div class="icon">🎬</div>
      <div>動画ファイルを選択 / ドロップ</div>
      <div class="sub">MKV（yt-dlp 形式）· MP4 · WebM</div>
      <div class="sub2">動画はこの端末に保存され、次回開いたとき自動で読み込まれます</div>
      <div class="fname"  id="vname"></div>
      <div class="status" id="vstatus"></div>
      <input type="file" id="vinput">
    </div>

    <div class="player-section" id="ps">
      <div class="presize" id="presize">
        <div class="pvideo" id="pvideo">
          <video id="vid" preload="metadata"></video>
          <canvas id="cvs"></canvas>
        </div>
        <div class="resize-handle-s"  id="rhandleS"></div>
        <div class="resize-handle-e"  id="rhandleE"></div>
        <div class="resize-handle-se" id="rhandleSE"></div>
      </div>
      <div class="controls">
        <button id="bplay">▶</button>
        <div class="seek">
          <input type="range" id="seek" value="0" min="0" step="0.1">
          <span class="time" id="tdisp">0:00 / 0:00</span>
        </div>
        <button id="bmute">🔊</button>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="1" style="width:55px;flex:none">
        <select id="spd" title="再生速度">
          <option value="0.5">×0.5</option>
          <option value="1" selected>×1</option>
          <option value="1.25">×1.25</option>
          <option value="1.5">×1.5</option>
          <option value="2">×2</option>
        </select>
        <button id="bdmk" class="on">弾幕</button>
        <button id="bencode">コメント付きで書き出す</button>
      </div>
      <div class="cbar">
        <span id="cinfo">コメント: -</span>
        <span id="cactive"></span>
        <span id="encstatus"></span>
      </div>
      <div class="meta" id="meta" style="display:none">
        <div class="meta-title" id="mtitle"></div>
        <div class="meta-stats"  id="mstats"></div>
        <div class="meta-tags"   id="mtags"></div>
        <div>
          <div class="desc-text"   id="mdesc"></div>
          <button class="desc-toggle" id="dtoggle" style="display:none">もっと見る</button>
        </div>
      </div>
    </div>

    <div class="hint">Space: 再生/停止 &nbsp;|&nbsp; ←→: ±5秒 &nbsp;|&nbsp; 動画の右端・下端・角をドラッグでサイズ変更 &nbsp;|&nbsp; Ctrl+Z: サイズを1つ前に戻す</div>
  </div>

  <script>
  'use strict';

  const vid    = document.getElementById('vid');
  const cvs    = document.getElementById('cvs');
  const ctx    = cvs.getContext('2d');
  const ps     = document.getElementById('ps');
  const presize= document.getElementById('presize');
  const pvideo = document.getElementById('pvideo');
  const bplay  = document.getElementById('bplay');
  const seekEl = document.getElementById('seek');
  const tdisp  = document.getElementById('tdisp');
  const bdmk   = document.getElementById('bdmk');
  const bencode= document.getElementById('bencode');
  const encstatus = document.getElementById('encstatus');
  const cinfo  = document.getElementById('cinfo');
  const cactive= document.getElementById('cactive');
  const drop   = document.getElementById('vdrop');
  const vinput = document.getElementById('vinput');
  const vstatus= document.getElementById('vstatus');
  const vname  = document.getElementById('vname');
  const wrapEl = document.querySelector('.wrap');

  // ── persisted state (localStorage: playback time + screen size) ────
  const STATE_KEY = 'danmaku-player-state';

  function normalizePx(v) {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'number') return v + 'px';
    return v;
  }

  function savePlayerState() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({
        time:   vid.currentTime || 0,
        width:  presize.style.width  || '',
        height: pvideo.style.height  || ''
      }));
    } catch (e) {}
  }
  function loadPlayerState() {
    try { return JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); }
    catch (e) { return null; }
  }

  // ── video storage (IndexedDB) — remembers the last loaded video file ──
  const DB_NAME = 'danmaku-player-db', DB_STORE = 'video';

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }
  async function saveVideoToDb(file) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(file, 'last');
      tx.oncomplete = () => resolve();
      tx.onerror    = () => reject(tx.error);
    });
  }
  async function loadVideoFromDb() {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx  = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get('last');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror   = () => reject(req.error);
    });
  }

  // ── resize handles (south / east / southeast) + Ctrl+Z undo history ──
  const handleS  = document.getElementById('rhandleS');
  const handleE  = document.getElementById('rhandleE');
  const handleSE = document.getElementById('rhandleSE');

  let boxHistory = [];
  function pushBoxHistory() {
    boxHistory.push({ width: presize.style.width || '', height: pvideo.style.height || '' });
    if (boxHistory.length > 20) boxHistory.shift();
  }
  function undoBox() {
    if (!boxHistory.length) return;
    const snap = boxHistory.pop();
    presize.style.width  = snap.width;
    pvideo.style.height  = snap.height;
    savePlayerState();
  }

  let dragMode = null, dragStartX = 0, dragStartY = 0, dragStartW = 0, dragStartH = 0;

  function beginDrag(mode, x, y) {
    pushBoxHistory();
    dragMode = mode;
    dragStartX = x; dragStartY = y;
    dragStartW = presize.offsetWidth;
    dragStartH = pvideo.offsetHeight;
    document.body.style.userSelect = 'none';
    document.body.style.cursor = mode === 'e' ? 'ew-resize' : mode === 's' ? 'ns-resize' : 'nwse-resize';
    handleS.classList.toggle('dragging', mode === 's' || mode === 'se');
    handleE.classList.toggle('dragging', mode === 'e' || mode === 'se');
    handleSE.classList.toggle('dragging', mode === 'se');
  }
  function updateDrag(x, y) {
    if (!dragMode) return;
    if (dragMode === 's' || dragMode === 'se') {
      pvideo.style.height = Math.max(120, dragStartH + (y - dragStartY)) + 'px';
    }
    if (dragMode === 'e' || dragMode === 'se') {
      const maxW = wrapEl.clientWidth;
      const newW = Math.min(maxW, Math.max(200, dragStartW + (x - dragStartX)));
      presize.style.width = newW + 'px';
    }
  }
  function endDrag() {
    if (!dragMode) return;
    dragMode = null;
    handleS.classList.remove('dragging');
    handleE.classList.remove('dragging');
    handleSE.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    savePlayerState();
  }

  handleS.addEventListener('mousedown',  e => { e.preventDefault(); beginDrag('s',  e.clientX, e.clientY); });
  handleE.addEventListener('mousedown',  e => { e.preventDefault(); beginDrag('e',  e.clientX, e.clientY); });
  handleSE.addEventListener('mousedown', e => { e.preventDefault(); beginDrag('se', e.clientX, e.clientY); });
  document.addEventListener('mousemove', e => updateDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup',   endDrag);

  handleS.addEventListener('touchstart',  e => { e.preventDefault(); const t=e.touches[0]; beginDrag('s',  t.clientX, t.clientY); }, { passive: false });
  handleE.addEventListener('touchstart',  e => { e.preventDefault(); const t=e.touches[0]; beginDrag('e',  t.clientX, t.clientY); }, { passive: false });
  handleSE.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; beginDrag('se', t.clientX, t.clientY); }, { passive: false });
  document.addEventListener('touchmove', e => { if (dragMode) { e.preventDefault(); const t=e.touches[0]; updateDrag(t.clientX, t.clientY); } }, { passive: false });
  document.addEventListener('touchend',  endDrag);

  // ── MKV attachment extractor ─────────────────────────────────
  async function extractInfoJson(file) {
    const CHUNK = 5 * 1024 * 1024;
    const buf   = await file.slice(0, Math.min(file.size, CHUNK)).arrayBuffer();
    const bytes = new Uint8Array(buf);
    const needle = new TextEncoder().encode('application/json');

    let markerEnd = -1;
    outer: for (let i = 0; i < bytes.length - needle.length; i++) {
      for (let j = 0; j < needle.length; j++) { if (bytes[i+j] !== needle[j]) continue outer; }
      markerEnd = i + needle.length; break;
    }
    if (markerEnd === -1) throw new Error('info.json アタッチメントが MKV 内に見つかりません');

    let jsonStart = -1;
    for (let i = markerEnd; i < bytes.length - 1; i++) {
      if (bytes[i] === 0x7B && bytes[i+1] === 0x22) { jsonStart = i; break; }
    }
    if (jsonStart === -1) throw new Error('JSON データが見つかりません');

    let depth = 0, inStr = false, esc = false, jsonEnd = -1;
    for (let i = jsonStart; i < bytes.length; i++) {
      const b = bytes[i];
      if (esc)              { esc = false; continue; }
      if (b === 0x5C && inStr) { esc = true; continue; }
      if (b === 0x22)       { inStr = !inStr; continue; }
      if (!inStr) {
        if      (b === 0x7B) depth++;
        else if (b === 0x7D) { if (--depth === 0) { jsonEnd = i; break; } }
      }
    }
    if (jsonEnd === -1) throw new Error('JSON の終端が見つかりません');
    return JSON.parse(new TextDecoder().decode(bytes.subarray(jsonStart, jsonEnd + 1)));
  }

  // ── comment extraction ────────────────────────────────────────
  let comments = [];

  function extractComments(data) {
    if (Array.isArray(data)) return data;
    if (data.subtitles) {
      for (const lang of Object.keys(data.subtitles)) {
        const entries = data.subtitles[lang];
        if (!Array.isArray(entries)) continue;
        for (const e of entries) {
          if (typeof e.data === 'string') {
            try { const r = JSON.parse(e.data); if (r.length) return r; } catch(x) {}
          }
        }
      }
    }
    return [];
  }

  // ── metadata display ─────────────────────────────────────────
  function showMeta(data) {
    document.getElementById('meta').style.display = '';
    document.getElementById('mtitle').textContent = data.title || data.fulltitle || '';

    const fmtNum  = n => n != null ? Number(n).toLocaleString('ja-JP') : null;
    const fmtDate = s => s ? `${s.slice(0,4)}/${s.slice(4,6)}/${s.slice(6,8)}` : null;
    const stats = [
      ['再生',   fmtNum(data.view_count)],
      ['高評価', fmtNum(data.like_count)],
      ['コメント',fmtNum(data.comment_count)],
      ['投稿日', fmtDate(data.upload_date)],
      ['長さ',   data.duration_string || null],
      ['投稿者', data.channel || data.uploader || null],
      ['ジャンル',data.genre || null],
    ];
    document.getElementById('mstats').innerHTML = stats
      .filter(([,v]) => v).map(([k,v]) => `<span>${k}: <strong>${v}</strong></span>`).join('');

    const tags = data.tags || [];
    const tagsEl = document.getElementById('mtags');
    tagsEl.innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');
    tagsEl.style.display = tags.length ? '' : 'none';

    const desc = data.description || '';
    const descEl = document.getElementById('mdesc');
    descEl.textContent = desc;
    const toggle = document.getElementById('dtoggle');
    if (desc.length > 150) {
      toggle.style.display = '';
      toggle.onclick = () => {
        const ex = descEl.classList.toggle('expanded');
        toggle.textContent = ex ? '閉じる' : 'もっと見る';
      };
    }
  }

  // ── loading a video (from drop/picker, or restored from IndexedDB) ──
  let restoreTime = null;

  async function handleVideoFile(f, opts) {
    opts = opts || {};
    const restore = !!opts.restore;
    const name = f.name || '動画';

    vname.textContent   = name;
    vstatus.textContent = restore ? '保存されていた動画を読み込み中…' : '';
    drop.classList.add('loaded');
    vid.src = URL.createObjectURL(f);
    ps.classList.add('show');

    if (restore) {
      const st = loadPlayerState();
      restoreTime = st && typeof st.time === 'number' ? st.time : null;
    } else {
      restoreTime = null;
      saveVideoToDb(f).catch(() => {});
    }

    const isMkv = name.toLowerCase().endsWith('.mkv') || f.type === 'video/x-matroska' || f.type === '';
    if (isMkv) {
      vstatus.textContent = (restore ? '保存されていた動画を読み込み中… ' : '') + 'info.json を抽出中…';
      try {
        const data = await extractInfoJson(f);
        const raw = extractComments(data);
        comments = raw
          .filter(c => c && c.body && typeof c.vposMs === 'number')
          .filter(c => (c.score || 0) > -2000)
          .sort((a, b) => a.vposMs - b.vposMs);
        cinfo.textContent = `コメント: ${comments.length.toLocaleString()} 件`;
        resetDanmaku();
        vstatus.textContent = `コメント ${comments.length.toLocaleString()} 件を抽出しました`;
        showMeta(data);
      } catch(e) {
        vstatus.textContent = '⚠ ' + e.message;
      }
    }
  }

  drop.addEventListener('click',     () => vinput.click());
  drop.addEventListener('dragover',  e  => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', ()  => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && handleVideoFile(e.dataTransfer.files[0]); });
  vinput.addEventListener('change',  () => vinput.files[0] && handleVideoFile(vinput.files[0]));

  // Restore last video automatically on page load
  (async () => {
    try {
      const stored = await loadVideoFromDb();
      if (stored) await handleVideoFile(stored, { restore: true });
    } catch (e) { /* IndexedDB unavailable or empty — ignore */ }
  })();

  // ── canvas (display / live preview) ─────────────────────────────
  // フォントサイズ・表示時間は本家ニコニコ(HTML5プレイヤー)の実装値に準拠
  // (基準: 1920x1080キャンバス／small=18 medium=27 big=39 px／
  //  流れるコメントは既定で(long+100)=400cs=4.0秒かけて画面を通過、
  //  固定(上下)コメントは既定でlong=300cs=3.0秒表示)
  const REF_H = 1080;
  const FONT_SIZE = { small: 18, medium: 27, big: 39 };
  const NAKA_DUR = 4.0, FIXED_DUR = 3.0;
  let scrollLanes = [], topLanes = [], botLanes = [];

  function resizeCanvas() {
    cvs.width  = vid.offsetWidth  || 640;
    cvs.height = vid.offsetHeight || 360;
    initLanes();
  }
  function initLanes() {
    const scale = cvs.height / REF_H;
    const lh = FONT_SIZE.medium * scale + 4;
    const n = Math.max(1, Math.floor(cvs.height / lh));
    scrollLanes = new Array(n).fill(null);
    topLanes    = new Array(Math.max(1, Math.floor(n * 0.45))).fill(0);
    botLanes    = new Array(Math.max(1, Math.floor(n * 0.45))).fill(0);
  }
  new ResizeObserver(resizeCanvas).observe(vid);

  // Set player size on load: restored size takes priority, else auto-fit to aspect ratio
  vid.addEventListener('loadedmetadata', () => {
    const state = loadPlayerState();
    const savedW = state ? normalizePx(state.width)  : '';
    const savedH = state ? normalizePx(state.height) : '';
    if (savedW) presize.style.width = savedW;
    if (savedH) {
      pvideo.style.height = savedH;
    } else if (vid.videoWidth && vid.videoHeight) {
      const w = presize.offsetWidth;
      const h = Math.round(Math.min(w * vid.videoHeight / vid.videoWidth, window.innerHeight * 0.82));
      pvideo.style.height = h + 'px';
    }
    if (restoreTime != null && isFinite(restoreTime)) {
      vid.currentTime = restoreTime;
      restoreTime = null;
    }
    updateMax();
  });

  // ── danmaku helpers (shared by live preview and export) ─────────
  const COLORS = {
    white:'#ffffff', red:'#ff5555', pink:'#ff88cc', orange:'#ffaa33',
    yellow:'#ffee33', green:'#55dd55', cyan:'#44eeff', blue:'#5599ff',
    purple:'#cc55ff', black:'#444444', maroon:'#cc2222',
    darkgreen:'#228822', darkblue:'#2255cc'
  };

  // scale: cvs.height(実際の再生画面の高さ) / REF_H(本家の基準高さ1080px)
  function parseCmd(cmds, scale) {
    let color = '#ffffff', size = 'medium', pos = 'scroll';
    for (const c of (cmds || [])) {
      const k = c.toLowerCase();
      if (COLORS[k])     color = COLORS[k];
      else if (k==='big')    size = 'big';
      else if (k==='small')  size = 'small';
      else if (k==='medium') size = 'medium';
      else if (k==='ue')     pos = 'top';
      else if (k==='shita')  pos = 'bot';
      // 「naka」は中央固定ではなく、通常の流れるコメントを明示するコマンド
      else if (k==='naka')   pos = 'scroll';
    }
    const fs = Math.max(1, Math.round(FONT_SIZE[size] * scale));
    return { color, fs, pos };
  }

  // 上/下固定コメント用: 単純に「表示時間切れのレーン」を探す
  function freeLane(lanes, vt) {
    for (let i = 0; i < lanes.length; i++) if (lanes[i] <= vt) return i;
    return Math.floor(Math.random() * lanes.length);
  }

  // 流れるコメント用: 本家同様、コメントごとに横幅で速度が変わる
  // (どのコメントも画面を横断するのにNAKA_DUR秒かかるよう速度を決める)ため、
  // 後から出たコメントが先行コメントに追いつく可能性を考慮してレーンを選ぶ
  function freeScrollLane(lanes, vt, speed, w, cvsWidth) {
    for (let i = 0; i < lanes.length; i++) {
      const occ = lanes[i];
      if (!occ || vt >= occ.expAt) return i; // 完全に空いている
      const occX = occ.x0 - occ.speed * (vt - occ.t0);
      const gap  = cvsWidth - occX - occ.w; // 新規コメントの先端と先行コメント後端との距離
      if (gap <= 0) continue;               // 既に埋まっている
      if (speed <= occ.speed) return i;     // 追いつけない速度なので安全
      const tCatch = vt + gap / (speed - occ.speed);
      if (tCatch >= occ.expAt) return i;    // 追いつく前に先行コメントが消える
    }
    return Math.floor(Math.random() * lanes.length);
  }

  // ── live preview danmaku engine (drawn on the overlay canvas) ────
  let active = [], nextIdx = 0, dmkOn = true, lastTs = null;

  function activateCmt(c) {
    const scale = cvs.height / REF_H;
    const { color, fs, pos } = parseCmd(c.commands, scale);
    const vt = vid.currentTime;
    ctx.font = `bold ${fs}px sans-serif`;
    const w = ctx.measureText(c.body).width;
    const lh = fs + 4;
    const a = { body: c.body, color, fs, pos, x: 0, y: 0, vx: 0, expAt: 0, w };

    if (pos === 'scroll') {
      const speed = (cvs.width + w) / NAKA_DUR;
      const li = freeScrollLane(scrollLanes, vt, speed, w, cvs.width);
      a.y = Math.min(li*lh+fs, cvs.height-4); a.x = cvs.width; a.vx = -speed;
      a.expAt = vt + NAKA_DUR;
      scrollLanes[li] = { x0: cvs.width, t0: vt, speed, w, expAt: a.expAt };
    } else if (pos === 'top') {
      const li = freeLane(topLanes, vt);
      a.y = Math.min(li*lh+fs, cvs.height/2); a.x = (cvs.width-w)/2;
      a.expAt = vt+FIXED_DUR; topLanes[li] = a.expAt;
    } else if (pos === 'bot') {
      const li = freeLane(botLanes, vt);
      a.y = Math.max(cvs.height-li*lh-4, fs); a.x = (cvs.width-w)/2;
      a.expAt = vt+FIXED_DUR; botLanes[li] = a.expAt;
    } else {
      a.y = cvs.height/2+fs/2; a.x = (cvs.width-w)/2; a.expAt = vt+FIXED_DUR;
    }
    active.push(a);
  }

  function resetDanmaku() {
    active = []; scrollLanes.fill(null); topLanes.fill(0); botLanes.fill(0); lastTs = null;
    const vt = vid.currentTime;
    nextIdx = 0;
    for (let i = 0; i < comments.length; i++) {
      if (comments[i].vposMs/1000 >= vt) { nextIdx = i; return; }
    }
    nextIdx = comments.length;
  }

  function tick(ts) {
    const dt = lastTs === null ? 0 : Math.min((ts-lastTs)/1000, 0.1);
    lastTs = ts;
    if (!vid.paused && !vid.ended && !isEncoding) {
      const vt = vid.currentTime;
      while (nextIdx < comments.length && comments[nextIdx].vposMs/1000 <= vt) activateCmt(comments[nextIdx++]);
      for (const a of active) a.x += a.vx*dt;
    }
    active = active.filter(a => a.pos==='scroll' ? a.x+a.w>0 : vid.currentTime<a.expAt);
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    if (dmkOn) {
      ctx.shadowColor='rgba(0,0,0,.85)'; ctx.shadowBlur=3; ctx.shadowOffsetX=ctx.shadowOffsetY=1;
      for (const a of active) { ctx.font=`bold ${a.fs}px sans-serif`; ctx.fillStyle=a.color; ctx.fillText(a.body,a.x,a.y); }
      ctx.shadowBlur=ctx.shadowOffsetX=ctx.shadowOffsetY=0;
    }
    cactive.textContent = dmkOn&&active.length ? `表示中: ${active.length}` : '';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── controls ─────────────────────────────────────────────────
  function fmt(s) {
    if (!isFinite(s)||s<0) s=0;
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }
  bplay.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
  vid.addEventListener('play',  () => { bplay.textContent='⏸'; lastTs=null; });
  vid.addEventListener('pause', () => { bplay.textContent='▶'; savePlayerState(); });
  vid.addEventListener('ended', () =>   bplay.textContent='▶');

  let lastStateSave = 0;
  vid.addEventListener('timeupdate', () => {
    if (!seekEl._drag) seekEl.value = vid.currentTime;
    tdisp.textContent = fmt(vid.currentTime)+' / '+fmt(vid.duration);
    const now = Date.now();
    if (now - lastStateSave > 3000) { lastStateSave = now; savePlayerState(); }
  });
  function updateMax() { seekEl.max = isFinite(vid.duration) ? vid.duration : 0; }
  vid.addEventListener('durationchange', updateMax);

  seekEl.addEventListener('mousedown', () => seekEl._drag=true);
  seekEl.addEventListener('input',     () => vid.currentTime=+seekEl.value);
  seekEl.addEventListener('change',    () => { seekEl._drag=false; vid.currentTime=+seekEl.value; resetDanmaku(); savePlayerState(); });
  vid.addEventListener('seeked', resetDanmaku);

  document.getElementById('bmute').addEventListener('click', function() {
    vid.muted=!vid.muted; this.textContent=vid.muted?'🔇':'🔊';
  });
  document.getElementById('vol').addEventListener('input', function() { vid.volume=+this.value; });
  document.getElementById('spd').addEventListener('change', function() { vid.playbackRate=+this.value; });

  bdmk.addEventListener('click', () => {
    dmkOn=!dmkOn; bdmk.classList.toggle('on',dmkOn);
    if (!dmkOn) ctx.clearRect(0,0,cvs.width,cvs.height);
  });

  window.addEventListener('beforeunload', savePlayerState);

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undoBox();
      return;
    }
    if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    if (e.key===' ')           { e.preventDefault(); bplay.click(); }
    else if (e.key==='ArrowLeft')  vid.currentTime=Math.max(0,vid.currentTime-5);
    else if (e.key==='ArrowRight') vid.currentTime=Math.min(vid.duration||0,vid.currentTime+5);
  });

  // ── encode: burn comments into the video and download ───────────
  let isEncoding = false;

  function encCreateState(w, h, scale) {
    const lh = FONT_SIZE.medium*scale + 4;
    const n = Math.max(1, Math.floor(h / lh));
    return {
      w, h, scale,
      scrollLanes: new Array(n).fill(null),
      topLanes:    new Array(Math.max(1, Math.floor(n*0.45))).fill(0),
      botLanes:    new Array(Math.max(1, Math.floor(n*0.45))).fill(0),
      active: [], nextIdx: 0
    };
  }
  function encActivate(st, c, vt, cctx2) {
    const { color, fs, pos } = parseCmd(c.commands, st.scale);
    cctx2.font = `bold ${fs}px sans-serif`;
    const w = cctx2.measureText(c.body).width;
    const lh = fs + 4;
    const a = { body: c.body, color, fs, pos, x: 0, y: 0, vx: 0, expAt: 0, w };
    if (pos === 'scroll') {
      const speed = (st.w + w) / NAKA_DUR;
      const li = freeScrollLane(st.scrollLanes, vt, speed, w, st.w);
      a.y = Math.min(li*lh+fs, st.h-4); a.x = st.w; a.vx = -speed;
      a.expAt = vt + NAKA_DUR;
      st.scrollLanes[li] = { x0: st.w, t0: vt, speed, w, expAt: a.expAt };
    } else if (pos === 'top') {
      const li = freeLane(st.topLanes, vt);
      a.y = Math.min(li*lh+fs, st.h/2); a.x = (st.w-w)/2;
      a.expAt = vt+FIXED_DUR; st.topLanes[li] = a.expAt;
    } else if (pos === 'bot') {
      const li = freeLane(st.botLanes, vt);
      a.y = Math.max(st.h-li*lh-4, fs); a.x = (st.w-w)/2;
      a.expAt = vt+FIXED_DUR; st.botLanes[li] = a.expAt;
    } else {
      a.y = st.h/2+fs/2; a.x = (st.w-w)/2; a.expAt = vt+FIXED_DUR;
    }
    st.active.push(a);
  }
  function encStep(st, vt, dt, cctx2) {
    while (st.nextIdx < comments.length && comments[st.nextIdx].vposMs/1000 <= vt) {
      encActivate(st, comments[st.nextIdx], vt, cctx2);
      st.nextIdx++;
    }
    for (const a of st.active) a.x += a.vx*dt;
    st.active = st.active.filter(a => a.pos==='scroll' ? a.x+a.w>0 : vt < a.expAt);

    cctx2.shadowColor = 'rgba(0,0,0,.85)';
    cctx2.shadowBlur = 3 * st.scale;
    cctx2.shadowOffsetX = cctx2.shadowOffsetY = 1 * st.scale;
    for (const a of st.active) { cctx2.font = `bold ${a.fs}px sans-serif`; cctx2.fillStyle = a.color; cctx2.fillText(a.body, a.x, a.y); }
    cctx2.shadowBlur = cctx2.shadowOffsetX = cctx2.shadowOffsetY = 0;
  }

  function updateEncodeUI(on) {
    bencode.disabled = on;
    bencode.textContent = on ? 'エンコード中…' : 'コメント付きで書き出す';
    seekEl.disabled = on;
    bplay.disabled = on;
    if (!on) encstatus.textContent = '';
  }

  async function encodeWithComments() {
    if (isEncoding) return;
    if (!vid.src || !isFinite(vid.duration) || vid.duration <= 0) {
      alert('先に動画を読み込んでください');
      return;
    }
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
      alert('このブラウザはエンコード機能に対応していません（Chrome を推奨します）');
      return;
    }

    isEncoding = true;
    updateEncodeUI(true);

    const outW = vid.videoWidth  || 1280;
    const outH = vid.videoHeight || 720;
    const scale = outH / REF_H;

    const composeCanvas = document.createElement('canvas');
    composeCanvas.width = outW; composeCanvas.height = outH;
    const cctx2 = composeCanvas.getContext('2d');

    let audioTracks = [];
    try {
      const ms = vid.captureStream ? vid.captureStream() : (vid.mozCaptureStream ? vid.mozCaptureStream() : null);
      if (ms) audioTracks = ms.getAudioTracks();
    } catch (e) {}

    const fps = 30;
    const videoTrack = composeCanvas.captureStream(fps).getVideoTracks()[0];
    const outStream = new MediaStream([videoTrack, ...audioTracks]);

    const mimeCandidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
    const recorder = new MediaRecorder(outStream, { mimeType, videoBitsPerSecond: 8000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

    const wasPaused = vid.paused, wasMuted = vid.muted, prevTime = vid.currentTime, prevRate = vid.playbackRate;

    vid.pause();
    await new Promise(r => { vid.currentTime = 0; const h = () => { vid.removeEventListener('seeked', h); r(); }; vid.addEventListener('seeked', h); });
    vid.playbackRate = 1;

    const st = encCreateState(outW, outH, scale);
    let lastPerf = performance.now();
    let rafId = null;

    function frameLoop() {
      const now = performance.now();
      const dt = (now - lastPerf) / 1000;
      lastPerf = now;
      const vt = vid.currentTime;

      cctx2.drawImage(vid, 0, 0, outW, outH);
      encStep(st, vt, dt, cctx2);

      encstatus.textContent = `エンコード中: ${fmt(vt)} / ${fmt(vid.duration)}`;
      rafId = requestAnimationFrame(frameLoop);
    }

    recorder.start(250);
    vid.play();
    rafId = requestAnimationFrame(frameLoop);

    await new Promise(resolve => {
      vid.addEventListener('ended', function onEnded() {
        vid.removeEventListener('ended', onEnded);
        resolve();
      });
    });

    cancelAnimationFrame(rafId);
    recorder.stop();
    const blob = await new Promise(resolve => { recorder.onstop = () => resolve(new Blob(chunks, { type: mimeType })); });

    vid.currentTime = prevTime;
    vid.playbackRate = prevRate;
    vid.muted = wasMuted;
    if (!wasPaused) vid.play();
    resetDanmaku();

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (vname.textContent || 'video').replace(/\.[^.]+$/, '') + '_danmaku.webm';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    isEncoding = false;
    updateEncodeUI(false);
  }

  bencode.addEventListener('click', encodeWithComments);
  </script>
</body>
</html>
